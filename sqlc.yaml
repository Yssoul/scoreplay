version: "2"
sql:
  # tags bounded context. Queries that touch the `tags` table only.
  - engine: postgresql
    queries: db/queries/tags.sql
    schema: db/migrations
    gen:
      go:
        package: tagsdb
        out: internal/tags/db
        sql_package: pgx/v5
        # Each block sees the full schema (so foreign-key resolution
        # works), but only emits the models its own queries actually
        # reference. This keeps tagsdb free of media types and vice
        # versa, even though the two contexts share a single schema
        # directory.
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "citext"
            go_type: "string"
          - db_type: "timestamptz"
            nullable: false
            go_type: "time.Time"

  # media bounded context. Queries that touch `media` and `media_tags`,
  # plus the `tags` existence check used by POST /media. The Medium
  # type generated by sqlc's English inflector is renamed to Media to
  # match the domain vocabulary used everywhere else in the codebase.
  - engine: postgresql
    queries: db/queries/media.sql
    schema: db/migrations
    gen:
      go:
        package: mediadb
        out: internal/media/db
        sql_package: pgx/v5
        omit_unused_structs: true
        rename:
          medium: "Media"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "citext"
            go_type: "string"
          - db_type: "timestamptz"
            nullable: false
            go_type: "time.Time"
