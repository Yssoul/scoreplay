version: "2"
sql:
  - engine: postgresql
    queries: db/queries
    schema: db/migrations
    gen:
      go:
        package: tagsdb
        out: internal/tags/db
        sql_package: pgx/v5
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "citext"
            go_type: "string"
          - db_type: "timestamptz"
            nullable: false
            go_type: "time.Time"
